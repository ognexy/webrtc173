<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AudioLink</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#0b0b0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}
  main{width:min(680px,92vw);padding:28px;border:1px solid #24242d;border-radius:22px;background:#121219;box-shadow:0 20px 70px #0008}
  h1{margin:0 0 8px;font-size:28px} p{color:#aaa;margin:0 0 22px}
  button,input{width:100%;border:0;border-radius:12px;padding:13px 15px;font-size:15px}
  button{background:#fff;color:#111;font-weight:700;cursor:pointer;margin-top:10px} button:disabled{opacity:.5;cursor:not-allowed}
  input{background:#0a0a0e;color:#fff;border:1px solid #2a2a34;margin-top:8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{margin-top:18px;padding:12px;border-radius:12px;background:#0b0b10;color:#bbb}
  .hide{display:none}.meter{height:7px;background:#25252e;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#fff;transition:width .08s}
  small{color:#777;display:block;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<main id="sender">
  <h1>🎙️ AudioLink</h1>
  <p>WebRTC audio-only streaming with browser voice processing.</p>

  <div class="row">
    <button id="start">Start microphone</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <input id="link" readonly placeholder="Your generated audio link appears here">
  <button id="copy" disabled>Copy audio-only link</button>

  <div class="status" id="status">Ready.</div>
  <div class="meter"><div class="bar" id="bar"></div></div>

  <small>
    Processing: Voice Isolation / noise suppression • Echo cancellation • Auto gain •
    Auto bass enhancement. Receiver pages contain no controls or video — only the incoming audio.
  </small>
</main>

<div id="receiver" class="hide">
  <audio id="audio" autoplay playsinline></audio>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const room = qs.get("room");
const sender = document.getElementById("sender");
const receiver = document.getElementById("receiver");
const audio = document.getElementById("audio");
const status = document.getElementById("status");
const link = document.getElementById("link");
const copy = document.getElementById("copy");
const bar = document.getElementById("bar");

let peer, call, stream, ctx, analyser, meterRAF;

function setStatus(x){ if(status) status.textContent=x; }

function makeProcessedStream(raw){
  ctx = new AudioContext();
  const source = ctx.createMediaStreamSource(raw);

  // Voice-isolation style processing:
  // - high-pass removes rumble
  // - low-pass removes harsh high-frequency noise
  // - gentle bass shelf
  // - compressor evens out voice volume
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 75; hp.Q.value = 0.7;

  const bass = ctx.createBiquadFilter();
  bass.type = "lowshelf"; bass.frequency.value = 180; bass.gain.value = 3.5;

  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 11000; lp.Q.value = 0.7;

  const compressor = ctx.createDynamicsCompressor();
  compressor.threshold.value = -24;
  compressor.knee.value = 18;
  compressor.ratio.value = 3;
  compressor.attack.value = 0.006;
  compressor.release.value = 0.15;

  const dest = ctx.createMediaStreamDestination();
  source.connect(hp).connect(bass).connect(lp).connect(compressor).connect(dest);

  analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  compressor.connect(analyser);

  return dest.stream;
}

async function startSender(){
  try{
    setStatus("Requesting microphone…");
    stream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true,
        channelCount:1
      },
      video:false
    });

    const processed = makeProcessedStream(stream);
    await ctx.resume();

    peer = new Peer(undefined,{debug:0});
    peer.on("call", incoming=>{
      // Receiver calls the sender with a silent stream; answer with processed audio.
      incoming.answer(processed);
      call = incoming;
    });
    peer.on("open", id=>{
      const u = new URL(location.href);
      u.search = "";
      u.searchParams.set("room",id);
      link.value = u.toString();
      copy.disabled = false;
      setStatus("Live. Share the generated link.");
    });
    peer.on("error", e=>setStatus("Connection error: "+e.type));
    peer.on("close", ()=>setStatus("Room closed."));

    document.getElementById("start").disabled=true;
    document.getElementById("stop").disabled=false;
    meter();
  }catch(e){
    setStatus("Microphone error: "+e.message);
  }
}

function meter(){
  if(!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  let sum=0;
  for(const x of data){ const v=(x-128)/128; sum+=v*v; }
  const rms=Math.sqrt(sum/data.length);
  bar.style.width=Math.min(100,rms*260)+"%";
  meterRAF=requestAnimationFrame(meter);
}

function stopSender(){
  cancelAnimationFrame(meterRAF);
  stream?.getTracks().forEach(t=>t.stop());
  ctx?.close();
  peer?.destroy();
  stream=null; peer=null;
  document.getElementById("start").disabled=false;
  document.getElementById("stop").disabled=true;
  copy.disabled=true;
  link.value="";
  setStatus("Stopped.");
  bar.style.width="0";
}

async function startReceiver(id){
  sender.classList.add("hide");
  receiver.classList.remove("hide");
  // The receiver URL is intentionally audio-only.
  const p = new Peer();
  p.on("open", ()=> {
    // A PeerJS call requires a MediaStream on the caller side.
    // This receiver connects to the room by calling with an empty stream.
    const silent = new AudioContext().createMediaStreamDestination().stream;
    const c = p.call(id, silent);
    c.on("stream", s=>{
      audio.srcObject=s;
      audio.play().catch(()=>{});
    });
  });
  p.on("error", ()=>{});
}

if(room){
  startReceiver(room);
}else{
  document.getElementById("start").onclick=startSender;
  document.getElementById("stop").onclick=stopSender;
  copy.onclick=async()=>{
    await navigator.clipboard.writeText(link.value);
    copy.textContent="Copied ✓";
    setTimeout(()=>copy.textContent="Copy audio-only link",1200);
  };
}
</script>
</body>
</html>
